name: recognizer
# one run per change: pushes to main, and pull requests (a push to a PR branch runs as the PR)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: build and test on Alpine
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.24 sh -euc '
            apk add -q build-base pkgconf json-c-dev python3 py3-numpy \
              py3-gobject3 py3-cairo gtk+3.0 font-dejavu xvfb-run git
            # the samples app draws with glassine_ui: the commit the packages build
            git clone -q https://github.com/GlassineOS/ui /tmp/ui
            git -C /tmp/ui checkout -q 77ed45f37ff8fbc1ce2acf8321a17b87a64cbbc5
            make -C recognizer OUT=/tmp check
            # a hang ends in tracebacks (faulthandler on SIGABRT), not in a stuck job
            PYTHONPATH=/tmp/ui/python GLASSINE_HWSAMPLES_WINDOW_TEST=1 PYTHONUNBUFFERED=1 PYTHONFAULTHANDLER=1 \
              timeout -s ABRT 600 xvfb-run -a make -C samples check HW_BIN=/tmp/glassine-handwriting'
