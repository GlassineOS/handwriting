name: recognizer
# one run per change: pushes to main, and pull requests (a push to a PR branch runs as the PR)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: build and test on Alpine
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.24 sh -euc '
            apk add -q build-base pkgconf json-c-dev python3 py3-numpy \
              py3-gobject3 py3-cairo gtk+3.0 font-dejavu xvfb dbus git \
              py3-fonttools harfbuzz-utils fontconfig wayland-dev py3-jsonschema
            # the samples app draws with glassine_ui: the commit the packages build
            git clone -q https://github.com/GlassineOS/ui /tmp/ui
            git -C /tmp/ui checkout -q 77ed45f37ff8fbc1ce2acf8321a17b87a64cbbc5
            make -C recognizer OUT=/tmp check
            # the base of Autograph: Edu SA Beginner as the packages fetch it, its centre lines made
            # and checked, then the font over it valid in all three styles
            gf=https://raw.githubusercontent.com/google/fonts/0b58fb370093f9a9f4ff785d94405710b79de67c/ofl/edusabeginner
            wget -q -O /tmp/EduSABeginner.ttf "$gf/EduSABeginner%5Bwght%5D.ttf"
            echo "aa39eadaddd5bca62854b13600167be9f3c8ee1a1f8e24c7058735c11d7411b22a7765bab261e8d3a5b5cfa42b83d915f2fa211e05e54956a5b28271c9555b14  /tmp/EduSABeginner.ttf" | sha512sum -c -
            make -C recognizer OUT=/tmp base BASE_TTF=/tmp/EduSABeginner.ttf
            HW_BIN=/tmp/glassine-handwriting HW_BASE=/tmp/base.jsonl python3 recognizer/tests/test_letters.py AutographBase
            # the service (spec 004) and its interface against the schema
            make -C service check HW_BIN=/tmp/glassine-handwriting
            # the pen interface end to end: glassine-handwriting.c of GlassineOS/sway in its
            # stand-in compositor, the protocol the same in all three repositories
            # GlassineOS/sway 1.10.1-glassine1
            git clone -q https://github.com/GlassineOS/sway /tmp/sway
            git -C /tmp/sway checkout -q aca6d106459f2f429304c98ae5844543802d8538
            git clone -q https://github.com/GlassineOS/protocols /tmp/protocols
            git -C /tmp/protocols checkout -q bd0f714c250a7d864c8d736e6b949fd43a9c3f57
            cmp client/glassine-handwriting-v1.xml /tmp/protocols/glassine-handwriting-v1.xml
            cmp client/glassine-handwriting-v1.xml /tmp/sway/protocols/glassine-handwriting-v1.xml
            sh /tmp/sway/test/handwriting-standin.sh /tmp/standin
            make -C client check O=/tmp/client HW_BIN=/tmp/glassine-handwriting HW_STANDIN=/tmp/standin
            # the window test on its own X server and session bus (the app is single instance
            # through it); a hang ends in tracebacks (faulthandler on SIGABRT), not in a stuck job
            Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp >/tmp/xvfb.log 2>&1 &
            for i in $(seq 50); do [ -e /tmp/.X11-unix/X99 ] && break; sleep 0.2; done
            DISPLAY=:99 PYTHONPATH=/tmp/ui/python GLASSINE_HWSAMPLES_WINDOW_TEST=1 PYTHONUNBUFFERED=1 \
              PYTHONFAULTHANDLER=1 dbus-run-session -- timeout -s ABRT -k 10 600 make -C samples check HW_BIN=/tmp/glassine-handwriting'
