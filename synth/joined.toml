# Connected school fonts for the point aligner's joined ink (train/README.md, "Joined ink";
# train/src/glassine_train/joined.py): the Playwrite family (TypeTogether, SIL Open Font
# License), each country's school model. Not the recognizer's fonts (fonts.toml): this list
# feeds only `alignrun joined`.
#
# style: "joined" (every lower-case letter joined to the next: a word one stroke), "semi"
# (most joined, some letters written apart, e.g. after e, g or k), "print" (written apart; not
# used by `alignrun joined`, listed for completeness). Measured by rendering words and counting
# the ink's parts.
#
# split: test fonts are those farthest from every other family (glyph-skeleton distance of the
# letters, mean nearest point, in x-heights: each at least 0.058 from its nearest, where most
# train fonts have one within 0.03 to 0.05), dev two more; the rest train. Playwrite's
# families share a design, so held-out writers here are nearer the training ones than the
# recognizer's held-out fonts are to theirs.

[source]
repository = "google/fonts"
ref = "main"

