# Font families from the google/fonts repository (directory under ofl/ or apache/).
# fetch checks each family's METADATA.pb: licence OFL (ofl/) or Apache 2.0 (apache/), category
# HANDWRITING. Regular weight only.
#
# split: "train" (default), "dev" (never trained on; model selection and decoder tuning) or
# "test" (never trained on, never used for any choice; the reported held-out numbers).
# style tags the held-out hands, so results can be reported per group: "print" (letters
# written apart) or "script" (joined, cursive letter forms). kalam and reeniebeanie are the
# original two held-out fonts; the others were drawn at random from the pool, six print and six
# script for test, two and two for dev. No held-out font has a near-duplicate in training
# (nearest training font by glyph-skeleton distance is no closer than the training fonts are
# to each other).
#
# Left out (the stroke extraction cannot turn them into a pen path, or the letters are not
# ordinary letter forms):
#   babylonica: ornamental capitals
#   ballet: capitals are ornamental swirls
#   bilboswashcaps: near-duplicate of bilbo
#   deliusswashcaps: near-duplicate of delius
#   fleurdeleah: ornamental capitals
#   giveyouglory: several lower-case letters drawn as capitals
#   kings: skeleton falls apart (rough outline)
#   lavishlyyours: ornamental capitals
#   loversquarrel: ornamental capitals
#   meaculpa: ornamental capitals
#   meddon: ornamental capitals
#   missfajardose: ornamental capitals
#   monsieurladoulaise: ornamental capitals
#   mrbedfort: capitals unreadable as letters
#   mrssaintdelafield: ornamental capitals
#   neonderthaw: double-line outline
#   passionsconflict: ornamental capitals
#   permanentmarker: lower case drawn as capitals
#   rocksalt: lower case drawn as capitals
#   sedgwickavedisplay: blobby skeleton
#   smooch: skeleton falls apart (brush texture)
#   splash: skeleton falls apart (spatter texture)
#   walterturncoat: lower case drawn as capitals
#   waterbrush: brush texture, broken digits
#   windsong: letters stretched into flourishes
#   yuyushort: letters flattened into lines

