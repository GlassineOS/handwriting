[project]
name = "glassine-synth"
version = "0.1.0"
description = "Synthetic online handwriting from handwriting fonts (prototype)"
license = "GPL-2.0-or-later"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2",
  "pillow>=11",
  "scikit-image>=0.25",
  "scipy>=1.14",
]

[project.scripts]
glassine-synth = "glassine_synth.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]
