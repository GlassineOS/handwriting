[project]
name = "glassine-train"
version = "0.1.0"
description = "Prototype online handwriting recognizer trained on glassine-synth ink"
license = "GPL-2.0-or-later"
requires-python = ">=3.12"
dependencies = [
  "glassine-synth",
  "numpy>=2",
  "torch>=2.5",
  "onnx>=1.17",
  "onnxruntime>=1.20",
  "fonttools>=4.40",  # which characters a font has (the model-4 generator)
  "scipy>=1.11",
  "uharfbuzz>=0.40",  # shaping the joined fonts (joined.py, the point aligner's joined ink)
]

[project.optional-dependencies]
lexicon = ["pyarrow>=15"]  # reading the word-list source (lexicon.py)

[project.scripts]
glassine-train = "glassine_train.cli:main"

[tool.uv.sources]
glassine-synth = { path = "../synth", editable = true }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]
